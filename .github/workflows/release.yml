name: Release

on:
  push:
    branches: [main]
    paths: [Config/Version.xcconfig]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'yatotm/CodexBar' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      CODEXBAR_LOCAL_OUTPUT: ${{ runner.temp }}/codexbar-build
      CODEXBAR_BUILD_CONFIGURATION: Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate version
        run: |
          python3 - <<'PY'
          import os, pathlib, re
          config = pathlib.Path('Config/Version.xcconfig').read_text()
          version = re.search(r'^MARKETING_VERSION\s*=\s*(\d+\.\d+\.\d+)\s*$', config, re.M).group(1)
          build = re.search(r'^CURRENT_PROJECT_VERSION\s*=\s*(\d+)\s*$', config, re.M).group(1)
          tag = 'v' + version
          if os.environ['GITHUB_REF'].startswith('refs/tags/') and os.environ['GITHUB_REF_NAME'] != tag:
              raise SystemExit('Tag 与版本配置不一致')
          if not pathlib.Path('ReleaseNotes', tag + '.md').is_file():
              raise SystemExit('缺少对应版本的 ReleaseNotes 文件')
          with open(os.environ['GITHUB_ENV'], 'a') as out:
              out.write(f'RELEASE_TAG={tag}\nRELEASE_BUILD={build}\n')
          PY
      - name: Verify
        run: |
          swiftformat --lint .
          swiftlint --strict
          bash Scripts/verify-usage-center.sh
          python3 -B -m unittest discover -s Tests -p 'test_release.py' -v
      - name: Build Release app
        run: bash Scripts/build-local.sh
      - name: Package and sign update
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          python3 Scripts/package-release.py \
            --app "$CODEXBAR_LOCAL_OUTPUT/CodexBar.app" \
            --output "$RUNNER_TEMP/release" \
            --signer "$CODEXBAR_LOCAL_OUTPUT/DerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update"
      - name: Publish annotated tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/publish-release.py --directory "$RUNNER_TEMP/release" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA"
      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build-log
          path: ${{ runner.temp }}/codexbar-build/build.log
