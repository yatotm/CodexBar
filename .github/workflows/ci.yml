name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned lint tools
        run: |
          python3 - <<'PY'
          import hashlib
          import io
          import os
          from pathlib import Path
          import urllib.request
          import zipfile

          root = Path(os.environ["RUNNER_TEMP"]) / "codexbar-lint"
          packages = [
              ("swiftformat", "https://github.com/nicklockwood/SwiftFormat/releases/download/0.63.0/swiftformat.zip", "28c7802e11fa5ae113d903066439c6bb1be20a8ac1ad9709c42616a7e273fb0f"),
              ("swiftlint", "https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip", "c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0"),
          ]
          for name, url, digest in packages:
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read()
              if hashlib.sha256(data).hexdigest() != digest:
                  raise SystemExit(name + " checksum mismatch")
              directory = root / name
              directory.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  archive.extractall(directory)
              (directory / name).chmod(0o755)
              with open(os.environ["GITHUB_PATH"], "a") as path_file:
                  path_file.write(str(directory) + "\n")
          PY
      - name: Check style
        run: |
          swiftformat --lint .
          swiftlint --strict
      - name: Run regression checks
        run: |
          bash Scripts/verify-usage-center.sh
          python3 -B -m unittest discover -s Tests -p 'test_shared_codex_collector.py' -v
          python3 -B -m unittest discover -s Tests -p 'test_release.py' -v
          python3 -B -m unittest discover -s Tests -p 'test_fork_migration.py' -v
          python3 -B -m unittest discover -s Tests -p 'test_issue_notification.py' -v
      - name: Run Swift unit tests
        env:
          CODEXBAR_TEST_OUTPUT: ${{ runner.temp }}/codexbar-tests
        run: bash Scripts/test-local.sh
      - name: Build app and helper
        env:
          CODEXBAR_LOCAL_OUTPUT: ${{ runner.temp }}/codexbar-build
        run: bash Scripts/build-local.sh
      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-build-log
          path: ${{ runner.temp }}/codexbar-build/build.log
