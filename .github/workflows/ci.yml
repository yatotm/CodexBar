name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install missing lint tools
        run: |
          command -v swiftformat >/dev/null || brew install swiftformat
          command -v swiftlint >/dev/null || brew install swiftlint
      - name: Check style
        run: |
          swiftformat --lint .
          swiftlint --strict
      - name: Run regression checks
        run: |
          bash Scripts/verify-usage-center.sh
          python3 -B -m unittest discover -s Tests -p 'test_release.py' -v
      - name: Build app and helper
        env:
          CODEXBAR_LOCAL_OUTPUT: ${{ runner.temp }}/codexbar-build
        run: bash Scripts/build-local.sh
      - name: Keep build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-build-log
          path: ${{ runner.temp }}/codexbar-build/build.log
